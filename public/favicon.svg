<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Nesrine Benlarbi — L'Atelier">
  <title>Nesrine Benlarbi — L'Atelier</title>

  <!-- Tuile arrondie, vert émeraude profond : même pastille que dans le pied de page -->
  <rect width="64" height="64" rx="18" fill="#2c3e2b"/>

  <!-- Monogramme « NB », tracé en lin. Les lettres sont dessinées et non
       composées : une police ne serait pas garantie dans une favicon. -->
  <g fill="none" stroke="#faf9f5" stroke-width="5" stroke-linejoin="miter" stroke-miterlimit="4">
    <!-- N : jambage montant, diagonale, jambage montant -->
    <path d="M12.5 46 V18 L27.5 46 V18"/>
    <!-- B : hampe, panse haute, panse basse -->
    <path d="M35 46 V18 H43 a7 7 0 0 1 0 14 H35"/>
    <path d="M43.5 32 a7.5 7.5 0 0 1 0 14 H35"/>
  </g>
</svg>
