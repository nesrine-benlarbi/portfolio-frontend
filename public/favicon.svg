<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Nesrine Benlarbi — L'Atelier">
  <title>Nesrine Benlarbi — L'Atelier</title>

  <!-- Le logo du site, repris à l'identique : le carré vert arrondi de la barre
       de navigation et du pied de page. Le rayon garde le rapport de Tailwind
       `rounded-xl` sur une pastille de 40 px, soit 12/40 — ici 19/64. -->
  <rect width="64" height="64" rx="19" fill="#2c3e2b"/>

  <!-- « NB » composé en serif gras, comme sur le site (classe `font-serif`),
       et non tracé en chemins : c'est ce qui garantit la ressemblance. -->
  <text x="32" y="33"
        text-anchor="middle" dominant-baseline="central"
        font-family="Georgia, 'Times New Roman', Times, serif"
        font-size="25" font-weight="700" letter-spacing="1.4"
        fill="#fbfaf7">NB</text>
</svg>
