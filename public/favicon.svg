<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="L'Atelier">
  <title>L'Atelier</title>

  <!-- Fond : vert émeraude profond de la charte -->
  <rect width="64" height="64" rx="14" fill="#2c3e2b"/>

  <!-- Monogramme « A » : deux jambages, tracé en lin -->
  <path d="M18 47 L32 17 L46 47"
        fill="none" stroke="#faf9f5" stroke-width="5.5"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Traverse en terre cuite : l'accent de la charte -->
  <path d="M24.5 37.5 H39.5"
        fill="none" stroke="#c2a679" stroke-width="5"
        stroke-linecap="round"/>
</svg>
