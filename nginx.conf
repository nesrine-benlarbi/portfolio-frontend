server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Routage SPA : toute route inconnue renvoie index.html
    # (indispensable pour React Router, sinon 404 au rafraîchissement
    # d'une URL profonde comme /projects/4)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache long pour les assets versionnés générés par Vite
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
